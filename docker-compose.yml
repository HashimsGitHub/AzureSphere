services:

  https-server:
    image: nginx:latest
    container_name: https-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/html:/usr/share/nginx/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  sftp-server:
    image: atmoz/sftp:latest
    container_name: sftp-server
    ports:
      - "22:22"
    volumes:
      - ./sftp/data:/home/testuser/files
    command: testuser:password:1001
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: azuresphere-agent
    network_mode: host
    restart: unless-stopped

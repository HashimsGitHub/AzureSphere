version: '3.8'

services:

  # ── VM B Dashboard (nginx serving the GUI) ────────────────────────────
  dashboard:
    image: nginx:alpine
    container_name: vmb-dashboard
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/html:/usr/share/nginx/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - persona-api
    networks:
      - azuresphere-net
    restart: unless-stopped

  # ── Persona API — Multi-protocol listener ─────────────────────────────
  persona-api:
    build: ./personas
    container_name: vmb-persona-api
    ports:
      - "9090:9090"   # API endpoint
      - "1433:1433"   # SQL Server
      - "5432:5432"   # PostgreSQL
      - "21:21"       # FTP
      - "5672:5672"   # RabbitMQ
      - "30015:30015" # SAP HANA
      - "5555:5555"   # webMethods
      # - "445:445"   # SMB - DISABLED for security
      - "8888:8888"   # Custom TCP App
    environment:
      API_PORT: "9090"
      VM_HOSTNAME: "vmB"
      # ── Add as many PERSONA_n as you want ──────────────────────────────
      # Format: "Name:PROTOCOL:PORT:Optional Banner"
      # Protocols: SQL, POSTGRES, FTP, RABBITMQ, HANA, WEBMETHODS, SMB, TCP
      PERSONA_1: "SQL Server 2022:SQL:1433:"
      PERSONA_2: "PostgreSQL 16:POSTGRES:5432:"
      PERSONA_3: "FTP Server:FTP:21:"
      PERSONA_4: "RabbitMQ 3.12:RABBITMQ:5672:"
      PERSONA_5: "SAP HANA:HANA:30015:"
      PERSONA_6: "webMethods IS:WEBMETHODS:5555:"
      # PERSONA_7: "SMB File Share:SMB:445:"  # DISABLED - Security risk
      PERSONA_8: "Custom TCP App:TCP:8888:220 Custom App Ready"
    networks:
      - azuresphere-net
    restart: unless-stopped

  # ── HTTPS/TLS persona — real nginx with SSL cert on port 8443 ─────────
  persona-https:
    image: nginx:alpine
    container_name: vmb-persona-https
    ports:
      - "8443:443"    # FIX: container listens on 443 (https-persona.conf: listen 443 ssl)
    volumes:
      - ./nginx/certs:/etc/nginx/certs
      - ./personas/https-persona.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - azuresphere-net
    restart: unless-stopped

  # ── SFTP persona — port 2222 (22 is reserved for SSH on VM B) ─────────
  persona-sftp:
    image: atmoz/sftp:alpine
    container_name: vmb-persona-sftp
    ports:
      - "2222:22"
    volumes:
      - ./sftp-data:/home/sftpuser/files
    command: sftpuser:SftpPass123:1001
    networks:
      - azuresphere-net
    restart: unless-stopped

# Shared network for all services
networks:
  azuresphere-net:
    name: azuresphere-network
    driver: bridge
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      # ── Build binaries ───────────────────────────────────────────────────

      - name: Build VM A agent (linux/amd64)
        run: |
          mkdir -p dist
          cd agent
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../dist/agent .

      - name: Build VM B persona server (linux/amd64)
        run: |
          cd simulator/personas
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o ../../dist/persona-server .

      # ── Bundle VM A ──────────────────────────────────────────────────────
      # Includes: pre-built agent binary + all existing VM A files as-is

      - name: Bundle VM A release
        run: |
          mkdir -p release/azuresphere-vma/nginx/conf
          mkdir -p release/azuresphere-vma/nginx/certs
          mkdir -p release/azuresphere-vma/nginx/html
          mkdir -p release/azuresphere-vma/sftp/data
          mkdir -p release/azuresphere-vma/agent

          # Pre-built binary (replaces docker build of agent)
          cp dist/agent                    release/azuresphere-vma/agent/agent

          # All existing VM A files — untouched
          cp index.html                    release/azuresphere-vma/index.html
          cp docker-compose.yml            release/azuresphere-vma/docker-compose.yml
          cp setup.sh                      release/azuresphere-vma/setup.sh
          cp start.sh                      release/azuresphere-vma/start.sh
          cp start-vma.sh                  release/azuresphere-vma/start-vma.sh

          tar -czf azuresphere-vma.tar.gz -C release azuresphere-vma

      # ── Bundle VM B ──────────────────────────────────────────────────────
      # Includes: pre-built persona-server binary + all existing VM B files as-is

      - name: Bundle VM B release
        run: |
          mkdir -p release/azuresphere-vmb/nginx/conf
          mkdir -p release/azuresphere-vmb/nginx/certs
          mkdir -p release/azuresphere-vmb/nginx/html
          mkdir -p release/azuresphere-vmb/personas
          mkdir -p release/azuresphere-vmb/sftp-data

          # Pre-built binary (replaces docker build of persona-api)
          cp dist/persona-server                         release/azuresphere-vmb/personas/persona-server

          # All existing VM B files — untouched
          cp simulator/docker-compose.yml                release/azuresphere-vmb/docker-compose.yml
          cp simulator/setup.sh                          release/azuresphere-vmb/setup.sh
          cp simulator/start-vmb.sh                      release/azuresphere-vmb/start-vmb.sh
          cp -r simulator/nginx/conf                     release/azuresphere-vmb/nginx/conf
          cp -r simulator/nginx/html                     release/azuresphere-vmb/nginx/html
          cp simulator/personas/https-persona.conf       release/azuresphere-vmb/personas/https-persona.conf

          tar -czf azuresphere-vmb.tar.gz -C release azuresphere-vmb

      # ── Publish GitHub Release ───────────────────────────────────────────

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            azuresphere-vma.tar.gz
            azuresphere-vmb.tar.gz
          generate_release_notes: true
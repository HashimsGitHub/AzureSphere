name: Deploy to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: SSH to Pull to Build to Reload
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     22222
          timeout:  180s
          script: |
            set -e
            cd ~/AzureSphere
            echo "Step 1 - Pulling latest code"
            git fetch origin main
            git reset --hard origin/main
            echo "Step 2 - Syncing index.html"
            cp index.html nginx/html/index.html
            echo "Step 3 - Building and starting containers"
            sudo docker-compose build agent
            sudo docker-compose up -d
            echo "Step 4 - Reloading nginx"
            sudo docker exec https-server nginx -s reload
            echo "Done - all services live"
            sudo docker-compose ps

name: Deploy to Azure VM

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: SSH → Pull → Copy → Reload nginx
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key:      ${{ secrets.VM_SSH_KEY }}
          port:     22
          timeout:  60s
          script: |
            set -e
            echo "━━━ [1/3] Pulling latest code ━━━"
            cd ~/AzureSphere
            git pull origin main
            echo "━━━ [2/3] Copying index.html into nginx html dir ━━━"
            cp index.html nginx/html/index.html
            echo "✓ Copied"
            echo "━━━ [3/3] Reloading nginx (zero downtime) ━━━"
            sudo docker exec https-server nginx -s reload
            echo "✓ Deploy complete — dashboard is live"